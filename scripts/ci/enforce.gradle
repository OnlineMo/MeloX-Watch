// Supplied by CI with --init-script. Application builds also opt in from settings.
if (System.getenv('GITHUB_ACTIONS') != 'true' || System.getenv('CI') != 'true') {
    throw new GradleException('Android compilation is cloud-only. Use the Cloud build workflow.')
}
def repositoryRoot = new File(gradle.startParameter.currentDir, '..').canonicalFile
def toolchain = new Properties()
new File(repositoryRoot, '.ci/toolchain.properties').withInputStream { toolchain.load(it) }
def releaseVersion = new Properties()
new File(repositoryRoot, 'version.properties').withInputStream { releaseVersion.load(it) }
if (gradle.gradleVersion != toolchain.getProperty('gradle.version')) {
    throw new GradleException('Gradle version differs from the cloud toolchain lock')
}
def packagePhase = System.getenv('MELOX_CI_BUILD_PHASE')
def packageDebugBinding = null
if (packagePhase == 'package-test-debug') {
    def raw = System.getenv('CI_PACKAGE_DEBUG_BINDING')
    if (raw == null || raw.getBytes('UTF-8').length > 2048) {
        throw new GradleException('Current-run Debug evidence binding is missing')
    }
    packageDebugBinding = new groovy.json.JsonSlurper().parseText(raw)
    def keys = ['repository', 'source_sha', 'build_sha', 'run_id', 'run_attempt', 'event', 'ref'] as Set
    if (!(packageDebugBinding instanceof Map) || packageDebugBinding.keySet() != keys ||
        packageDebugBinding.repository != 'OnlineMo/MeloX-Watch' ||
        !(packageDebugBinding.source_sha ==~ /[0-9a-f]{40}/) || !(packageDebugBinding.build_sha ==~ /[0-9a-f]{40}/) ||
        packageDebugBinding.source_sha != System.getenv('SOURCE_SHA') ||
        packageDebugBinding.event != System.getenv('GITHUB_EVENT_NAME') || packageDebugBinding.ref != System.getenv('GITHUB_REF') ||
        ['run_id': 'GITHUB_RUN_ID', 'run_attempt': 'GITHUB_RUN_ATTEMPT'].any { key, variable ->
            !(packageDebugBinding[key] instanceof Integer || packageDebugBinding[key] instanceof Long || packageDebugBinding[key] instanceof BigInteger) ||
            packageDebugBinding[key].toString() != System.getenv(variable)
        }) {
        throw new GradleException('Current-run Debug evidence binding differs')
    }
} else if (System.getenv('CI_PACKAGE_DEBUG_BINDING')) {
    throw new GradleException('Debug evidence binding belongs only to its full test stage')
}
def freshPackageSchema = System.getenv('CI_PACKAGE_FRESH_ROOM_SCHEMA') == 'true'
if (freshPackageSchema && !(packagePhase == 'package-strict-inputs' &&
    System.getenv('GITHUB_EVENT_NAME') == 'pull_request' && System.getenv('CI_UNSIGNED_APK') == 'true')) {
    throw new GradleException('Fresh package schema export requires the explicit strict owner PR stage')
}
// 仅缺依赖/Room输入的无秘密PR采集开启；普通构建不安装监听器，也不额外解析图。
def dependencyDiagnosticPhase = System.getenv('CI_DEPENDENCY_DIAGNOSTIC_PHASE')
def dependencyDiagnosticEnabled = System.getenv('GITHUB_EVENT_NAME') == 'pull_request' &&
    ['verification-collection', 'verification-debug', 'verification-release', 'verification-diagnostic',
     'normal-lock-collection', 'strict-debug', 'strict-release',
     'strict-diagnostic'].contains(dependencyDiagnosticPhase)
def diagnosticConfigurations = (['implementationDependenciesMetadata'] +
    ['Debug', 'Release', 'Diagnostic'].collectMany { variant ->
        ["watchAndroid${variant}RuntimeClasspath".toString(),
         "watchAndroid${variant}UnitTestRuntimeClasspath".toString()]
    }) as Set
def diagnosticModules = ['kotlin-stdlib', 'kotlin-stdlib-common', 'kotlin-stdlib-jdk7',
                         'kotlin-stdlib-jdk8'] as Set
def diagnosticComposeModules = ['runtime', 'runtime-android'] as Set
def diagnosticAttributeNames = [
    'artifactType', 'com.android.build.api.attributes.AgpVersionAttr',
    'com.android.build.api.attributes.BuildTypeAttr',
    'com.android.build.api.attributes.ProductFlavor:platform',
    'com.android.build.api.attributes.VariantAttr', 'org.gradle.category',
    'org.gradle.dependency.bundling', 'org.gradle.jvm.environment', 'org.gradle.jvm.version',
    'org.gradle.libraryelements', 'org.gradle.status', 'org.gradle.usage',
    'org.jetbrains.kotlin.platform.type',
] as Set
def diagnosticUnavailableCodes = [
    'graph-component-bound', 'graph-edge-bound', 'stdlib-component-bound', 'stdlib-edge-bound',
    'compose-component-bound',
    'variant-bound', 'external-variant-bound', 'attribute-bound', 'unresolved-class-bound',
    'unsafe-text', 'record-byte-bound',
    'unsupported-component-identifier', 'unsupported-dependency-result',
] as Set
def diagnosticBound = { condition, code ->
    if (!condition) {
        throw new IllegalArgumentException(code)
    }
}
def diagnosticText = { value, maximum ->
    def text = value == null ? null : value.toString()
    // 公开API的坐标/属性/变体名称允许版本范围，拒绝路径、URL与控制字符。
    diagnosticBound(text != null && text.length() <= maximum &&
        text ==~ /[A-Za-z0-9_.:+,\[\]() ='{}\-]*/, 'unsafe-text')
    text
}
def diagnosticType = { failure ->
    def name = failure.getClass().name
    diagnosticBound(name ==~ /[A-Za-z0-9_.$]{1,200}/, 'unsafe-text')
    name
}
def diagnosticAttributes = { attributes ->
    def keys = attributes.keySet()
    diagnosticBound(keys.size() <= 64, 'attribute-bound')
    def selected = keys.findAll { diagnosticAttributeNames.contains(it.name) }.sort { it.name }
    [values: selected.collectEntries { key ->
        [(key.name): diagnosticText(attributes.getAttribute(key), 160)]
    }, excluded_count: keys.size() - selected.size()]
}
def diagnosticComponent = { identifier ->
    if (identifier instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
        return [kind: 'module', group: diagnosticText(identifier.group, 120),
                module: diagnosticText(identifier.module, 120), version: diagnosticText(identifier.version, 120)]
    }
    if (identifier instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier) {
        return [kind: 'project', project_path: diagnosticText(identifier.projectPath, 120),
                build_tree_path: diagnosticText(identifier.buildTreePath, 120)]
    }
    throw new IllegalArgumentException('unsupported-component-identifier')
}
def diagnosticVariant
diagnosticVariant = { variant, depth ->
    diagnosticBound(depth <= 4, 'external-variant-bound')
    def external = variant.externalVariant
    [name: diagnosticText(variant.displayName, 200), owner: diagnosticComponent(variant.owner),
     attributes: diagnosticAttributes(variant.attributes),
     external_variant: external.isPresent() ? diagnosticVariant(external.get(), depth + 1) : null]
}
def dependencyCollectorActive = false
def emitDependencyDiagnostic = { project, configuration, origin, cachedResult ->
    def base = [schema_version: 2, phase: dependencyDiagnosticPhase, project: project.path,
                configuration: configuration.name, origin: origin]
    def record
    try {
        // afterResolve时图已缓存；collector传入它刚读取的同一个Result，不请求文件或另一次解析。
        def result = cachedResult == null ? configuration.incoming.resolutionResult : cachedResult
        def components = result.allComponents
        def dependencies = result.allDependencies
        diagnosticBound(components.size() <= 20000, 'graph-component-bound')
        diagnosticBound(dependencies.size() <= 60000, 'graph-edge-bound')
        def stdlibComponents = components.findAll { component ->
            component.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier &&
                component.id.group == 'org.jetbrains.kotlin' && diagnosticModules.contains(component.id.module)
        }
        def stdlibEdges = dependencies.findAll { edge ->
            edge.requested instanceof org.gradle.api.artifacts.component.ModuleComponentSelector &&
                edge.requested.group == 'org.jetbrains.kotlin' && diagnosticModules.contains(edge.requested.module)
        }
        diagnosticBound(stdlibComponents.size() <= 32, 'stdlib-component-bound')
        diagnosticBound(stdlibEdges.size() <= 512, 'stdlib-edge-bound')
        // 直接观察真实依赖发起方的选中变体；即使它的stdlib边消失，也不靠边反推变体。
        def composeComponents = components.findAll { component ->
            component.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier &&
                component.id.group == 'androidx.compose.runtime' && diagnosticComposeModules.contains(component.id.module)
        }
        diagnosticBound(composeComponents.size() <= 8, 'compose-component-bound')
        def unresolvedClasses = [:]
        dependencies.findAll {
            it instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult
        }.each { edge ->
            def type = diagnosticType(edge.failure)
            unresolvedClasses[type] = (unresolvedClasses[type] ?: 0) + 1
            diagnosticBound(unresolvedClasses.size() <= 64, 'unresolved-class-bound')
        }
        def selectedComponents = stdlibComponents.collect { component ->
            diagnosticBound(component.variants.size() <= 16, 'variant-bound')
            [component: diagnosticComponent(component.id),
             selected_variants: component.variants.collect { diagnosticVariant(it, 0) }.sort {
                 groovy.json.JsonOutput.toJson(it)
             }]
        }.sort { groovy.json.JsonOutput.toJson(it.component) }
        def selectedComposeComponents = composeComponents.collect { component ->
            diagnosticBound(component.variants.size() <= 16, 'variant-bound')
            [component: diagnosticComponent(component.id),
             selected_variants: component.variants.collect { diagnosticVariant(it, 0) }.sort {
                 groovy.json.JsonOutput.toJson(it)
             }]
        }.sort { groovy.json.JsonOutput.toJson(it.component) }
        def requestedEdges = stdlibEdges.collect { edge ->
            def selector = edge.requested
            def constraint = selector.versionConstraint
            def entry = [from: diagnosticComponent(edge.from.id), is_constraint: edge.isConstraint(),
                         requested: [group: selector.group, module: selector.module,
                                     version: diagnosticText(selector.version, 120),
                                     version_constraint: [required: diagnosticText(constraint.requiredVersion, 120),
                                                          strict: diagnosticText(constraint.strictVersion, 120),
                                                          preferred: diagnosticText(constraint.preferredVersion, 120)]]]
            if (edge instanceof org.gradle.api.artifacts.result.ResolvedDependencyResult) {
                entry += [status: 'resolved', selected: diagnosticComponent(edge.selected.id),
                          resolved_variant: diagnosticVariant(edge.resolvedVariant, 0)]
            } else if (edge instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult) {
                entry += [status: 'unresolved', failure_class: diagnosticType(edge.failure)]
            } else {
                throw new IllegalArgumentException('unsupported-dependency-result')
            }
            entry
        }.sort { groovy.json.JsonOutput.toJson(it) }
        record = base + [status: 'observed',
                         configuration_requested_attributes: diagnosticAttributes(configuration.attributes),
                         result_requested_attributes: diagnosticAttributes(result.requestedAttributes),
                         graph: [component_count: components.size(), dependency_count: dependencies.size(),
                                 unresolved_dependency_count: unresolvedClasses.values().sum(0),
                                 unresolved_failure_classes: unresolvedClasses.sort()],
                         stdlib_components: selectedComponents, stdlib_edges: requestedEdges,
                         compose_runtime_components: selectedComposeComponents]
        diagnosticBound(groovy.json.JsonOutput.toJson(record).getBytes('UTF-8').length <= 128 * 1024,
                        'record-byte-bound')
    } catch (Exception failure) {
        // 观察失败与原图的拒绝独立；不打印任意异常message、路径或凭据，也不伪称截断资料完整。
        def code = diagnosticUnavailableCodes.contains(failure.message) ? failure.message : 'observation-api-failed'
        def failureClass = failure.getClass().name
        record = base + [status: 'unavailable', reason: code,
                         failure_class: failureClass ==~ /[A-Za-z0-9_.$]{1,200}/ ? failureClass : 'unavailable']
    }
    project.logger.lifecycle('CI_DEPENDENCY_GRAPH ' + groovy.json.JsonOutput.toJson(record))
}
// 稳定证书永远不进入 Gradle。最终 DSL 清除 AGP 默认 Debug 签名，交给新 runner 签名。
def clearApkSigning = { target ->
    // AGP 8.11.1 有多种 signingConfig setter；Groovy 的 null 需明确选 APK DSL 接口。
    // init script 先于 AGP 载入，只在回调内按公开签名选择方法，不引用应用脚本。
    def setter = target.getClass().methods.find { method ->
        method.name == 'setSigningConfig' && method.parameterTypes.length == 1 &&
            method.parameterTypes[0].name == 'com.android.build.api.dsl.ApkSigningConfig'
    }
    if (setter == null) {
        throw new GradleException('AGP APK signing setter differs from the locked toolchain')
    }
    setter.invoke(target, [null] as Object[])
    if (target.signingConfig != null) {
        throw new GradleException('AGP did not clear the APK signing configuration')
    }
}
gradle.beforeProject { project ->
    project.plugins.withId('com.android.application') {
        if (dependencyDiagnosticEnabled && project.path == ':app') {
            project.configurations.configureEach { configuration ->
                if (diagnosticConfigurations.contains(configuration.name)) {
                    def firstGraphRecorded = false
                    configuration.incoming.afterResolve {
                        if (!firstGraphRecorded) {
                            firstGraphRecorded = true
                            // 标记采集器内/外的首次解析，不声称观察到具体触发任务。
                            emitDependencyDiagnostic(project, configuration,
                                dependencyCollectorActive ? 'after-resolve-inside-collector' :
                                    'after-resolve-outside-collector', null)
                        }
                    }
                }
            }
        }
        def components = project.extensions.getByName('androidComponents')
        components.finalizeDsl({ android ->
            if (System.getenv('CI_UNSIGNED_APK') == 'true') {
                android.buildTypes.each { buildType -> clearApkSigning(buildType) }
                android.productFlavors.each { flavor -> clearApkSigning(flavor) }
                clearApkSigning(android.defaultConfig)
            }
        } as org.gradle.api.Action)
    }
}
gradle.projectsEvaluated {
    if (packagePhase?.startsWith('package-')) {
        if (gradle.rootProject.allprojects.collect { it.path }.sort() != [':', ':app', ':companion']) {
            throw new GradleException('Package builds require exactly the watch and phone application projects')
        }
        def fullDebugTests = [':app:testWatchAndroidDebugUnitTest', ':companion:testPhoneAndroidDebugUnitTest']
        if (packagePhase == 'package-test-debug') {
            fullDebugTests.each { id ->
                def selected = gradle.rootProject.tasks.getByPath(id)
                if (!(selected instanceof org.gradle.api.tasks.testing.Test)) {
                    throw new GradleException('The complete package Debug test scope is unavailable')
                }
                // Current-run JUnit evidence is required; compilation still uses its normal cache.
                selected.outputs.upToDateWhen { false }
                selected.outputs.doNotCacheIf('The full Debug scope needs current-run evidence') { true }
                selected.scanForTestClasses = true
                selected.reports.junitXml.required.set(true)
                def scopeFor = {
                    if (!(selected.options instanceof org.gradle.api.tasks.testing.junit.JUnitOptions)) {
                        throw new GradleException('The declared full Debug scope requires the locked JUnit4 task')
                    }
                    [includes: selected.includes.toList().sort(), excludes: selected.excludes.toList().sort(),
                     include_patterns: selected.filter.includePatterns.toList().sort(),
                     exclude_patterns: selected.filter.excludePatterns.toList().sort(),
                     command_line_include_patterns: selected.filter.commandLineIncludePatterns.toList().sort(),
                     include_categories: selected.options.includeCategories.toList().sort(),
                     exclude_categories: selected.options.excludeCategories.toList().sort(),
                     test_framework: 'junit4', scan_for_test_classes: selected.scanForTestClasses]
                }
                def expectedScope = [includes: [], excludes: [], include_patterns: [], exclude_patterns: [],
                    command_line_include_patterns: [], include_categories: [], exclude_categories: [],
                    test_framework: 'junit4', scan_for_test_classes: true]
                def requireScope = {
                    if (!selected.enabled || scopeFor() != expectedScope) {
                        throw new GradleException('The full Debug task cannot be disabled or filtered')
                    }
                }
                requireScope()
                selected.doFirst { requireScope() }
                def completedRoot = [result: null]
                selected.addTestListener(new org.gradle.api.tasks.testing.TestListener() {
                    void beforeSuite(org.gradle.api.tasks.testing.TestDescriptor suite) {}
                    void beforeTest(org.gradle.api.tasks.testing.TestDescriptor test) {}
                    void afterTest(org.gradle.api.tasks.testing.TestDescriptor test, org.gradle.api.tasks.testing.TestResult result) {}
                    void afterSuite(org.gradle.api.tasks.testing.TestDescriptor suite, org.gradle.api.tasks.testing.TestResult result) {
                        if (suite.parent == null) {
                            if (completedRoot.result != null) {
                                throw new GradleException('Debug Test task produced duplicate root TestResult')
                            }
                            completedRoot.result = result
                        }
                    }
                })
                gradle.taskGraph.afterTask { task, state ->
                    if (task.path == id && state.failure == null) {
                        requireScope()
                        def result = completedRoot.result
                        if (!state.executed || state.skipped || state.noSource || state.upToDate || !state.didWork ||
                            result == null || result.resultType != org.gradle.api.tasks.testing.TestResult.ResultType.SUCCESS ||
                            result.testCount <= 0 || result.testCount > 20000 || result.successfulTestCount != result.testCount ||
                            result.failedTestCount != 0 || result.skippedTestCount != 0) {
                            throw new GradleException('Current-run full Debug TestResult is missing, cached, skipped or incomplete')
                        }
                        def role = id.startsWith(':app:') ? 'watch' : 'phone'
                        def record = [schema_version: 1, kind: 'package-debug-task-result', role: role, task: id,
                            outcome: 'executed', result: 'SUCCESS', test_count: result.testCount,
                            successful_test_count: result.successfulTestCount, failed_test_count: result.failedTestCount,
                            skipped_test_count: result.skippedTestCount, started_at_epoch_ms: result.startTime,
                            completed_at_epoch_ms: result.endTime, scope: scopeFor()] + packageDebugBinding
                        byte[] bytes = (groovy.json.JsonOutput.toJson(record) + '\n').getBytes('UTF-8')
                        if (bytes.length > 8192) throw new GradleException('Debug TestResult receipt exceeds its bound')
                        def path = new File(repositoryRoot, 'android/app/build/reports/package-debug-tests/' + role + '-task-result.json').toPath()
                        def cursor = path
                        while (cursor != null) {
                            if (java.nio.file.Files.isSymbolicLink(cursor)) throw new GradleException('Debug evidence path is linked')
                            cursor = cursor.parent
                        }
                        java.nio.file.Files.write(path, bytes, java.nio.file.StandardOpenOption.CREATE_NEW,
                            java.nio.file.StandardOpenOption.WRITE, java.nio.file.LinkOption.NOFOLLOW_LINKS)
                    }
                }
            }
        }
        if (freshPackageSchema) {
            def selected = gradle.rootProject.tasks.getByPath(':app:kspWatchAndroidDebugKotlin')
            // Regenerate only the current schema producer after its new writer export is removed.
            selected.outputs.upToDateWhen { false }
            selected.outputs.doNotCacheIf('The current Room export needs an independent strict producer') { true }
        }
        gradle.taskGraph.whenReady { graph ->
            def observed = graph.allTasks.findAll { it instanceof org.gradle.api.tasks.testing.Test }.collect { it.path }.sort()
            if (observed != (packagePhase == 'package-test-debug' ? fullDebugTests.sort() : [])) {
                throw new GradleException('Package stages must run the declared full Debug scope exactly once')
            }
            if (freshPackageSchema && !graph.hasTask(':app:kspWatchAndroidDebugKotlin')) {
                throw new GradleException('The independent strict Room schema producer is missing')
            }
            if (['package-acquire', 'package-strict-inputs'].contains(packagePhase) && graph.allTasks.any {
                it.path ==~ /:(app|companion):(assemble|package)(WatchAndroid|PhoneAndroid)(Debug|Release|Diagnostic)(AndroidTest)?/
            }) {
                throw new GradleException('Input acquisition cannot assemble or package APKs')
            }
        }
    }
    // Gradle保留本轮未解析的旧锁配置；up-to-date任务不能替代显式解析证据。
    // 此任务只供无秘密PR采集正常图，三轮独立strict仍决定资料是否完整。
    gradle.rootProject.tasks.register('ciResolveAndLockAll') { task ->
        task.notCompatibleWithConfigurationCache('Dependency lock collection resolves project configurations')
        // 显式调度保证真实消费者先运行；CLI排列不能替代多项目/并行的顺序约束。
        task.mustRunAfter(['Debug', 'Release', 'Diagnostic'].collectMany { variant ->
            [":app:testWatchAndroid${variant}UnitTest", ":app:lintWatchAndroid${variant}",
             ":app:assembleWatchAndroid${variant}"]
        })
        if (gradle.startParameter.taskNames.contains(':app:assembleWatchAndroidDiagnosticAndroidTest')) {
            task.mustRunAfter(':app:assembleWatchAndroidDiagnosticAndroidTest')
        }
        task.doLast {
            if (!gradle.startParameter.writeDependencyLocks) {
                throw new GradleException('Lock collection requires --write-locks')
            }
            dependencyCollectorActive = true
            try {
                gradle.rootProject.allprojects.sort { it.path }.each { project ->
                    project.configurations.findAll { it.canBeResolved }.sort { it.name }.each { configuration ->
                        // 锁来自完整依赖图；无需选择AGP测试配置的secondary artifact。
                        def result = configuration.incoming.resolutionResult
                        if (dependencyDiagnosticEnabled && project.path == ':app' &&
                            diagnosticConfigurations.contains(configuration.name)) {
                            emitDependencyDiagnostic(project, configuration, 'collector-snapshot', result)
                        }
                        def unresolved = result.allDependencies.findAll {
                            it instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult
                        }
                        if (!unresolved.isEmpty()) {
                            throw new GradleException(
                                "Dependency graph resolution failed for ${project.path}:${configuration.name}",
                                unresolved.first().failure
                            )
                        }
                        project.logger.lifecycle("Resolved lock input ${project.path}:${configuration.name}")
                    }
                }
            } finally {
                dependencyCollectorActive = false
            }
        }
    }
    gradle.rootProject.allprojects { project ->
        def android = project.extensions.findByName('android')
        if (android != null) {
            if (android.compileSdk != toolchain.getProperty('android.compileSdk').toInteger() ||
                android.buildToolsVersion != toolchain.getProperty('android.buildTools')) {
                throw new GradleException("SDK/build tools drift in ${project.path}")
            }
            def components = project.extensions.findByName('androidComponents')
            // AndroidPluginVersion.toString() 带说明前缀；version 才是公开 Maven 版本值。
            def actualAgp = components.pluginVersion.version
            if (actualAgp != toolchain.getProperty('agp.version')) {
                throw new GradleException("AGP version drift in ${project.path}: ${actualAgp}")
            }
        }
        if (project.plugins.hasPlugin('com.android.application')) {
            def config = android.defaultConfig
            if (config.minSdk != toolchain.getProperty('android.minSdk').toInteger() ||
                config.targetSdk != toolchain.getProperty('android.targetSdk').toInteger() ||
                config.versionName != releaseVersion.getProperty('versionName') ||
                config.versionCode != releaseVersion.getProperty('versionCode').toInteger()) {
                throw new GradleException('Application SDK/version must come from the repository policy files')
            }
        }
    }
}
