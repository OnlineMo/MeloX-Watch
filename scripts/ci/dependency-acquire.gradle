// Only the explicit owner PR migration installs this writer. Graph resolution never stands for file bytes.
import java.nio.file.Files
import java.nio.file.LinkOption
import java.nio.file.StandardOpenOption
import java.security.MessageDigest
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult
import org.gradle.api.tasks.testing.Test

def requireMigration = { condition, message ->
    if (!condition) throw new GradleException(message)
}
requireMigration(System.getenv('GITHUB_ACTIONS') == 'true' && System.getenv('CI') == 'true' &&
    System.getenv('GITHUB_EVENT_NAME') == 'pull_request' && System.getenv('CI_UNSIGNED_APK') == 'true' &&
    System.getenv('GITHUB_REPOSITORY') == 'OnlineMo/MeloX-Watch' && System.getenv('GITHUB_ACTOR') == 'OnlineMo' &&
    System.getenv('GITHUB_ACTOR_ID') == '143324986' && System.getenv('GITHUB_TRIGGERING_ACTOR') == 'OnlineMo' &&
    System.getenv('MELOX_CI_BUILD_PHASE') == 'migration-acquire' && !System.getenv('CANDIDATE_OPERATION'),
    'Dependency acquisition requires the explicit unsigned owner PR phase')
requireMigration(gradle.startParameter.writeDependencyVerifications == ['sha256'] &&
    gradle.startParameter.writeDependencyLocks && gradle.startParameter.rerunTasks &&
    !gradle.startParameter.buildCacheEnabled && gradle.startParameter.excludedTaskNames.isEmpty(),
    'Dependency acquisition requires one SHA-256 writer with real consumers and lock capture')

def binding = [:]
['source_sha': 'SOURCE_SHA', 'build_sha': 'GITHUB_SHA', 'event': 'GITHUB_EVENT_NAME', 'ref': 'GITHUB_REF'].each { key, variable ->
    binding[key] = System.getenv(variable)
}
requireMigration(binding.source_sha ==~ /[0-9a-f]{40}/ && binding.build_sha ==~ /[0-9a-f]{40}/ &&
    binding.ref ==~ /refs\/pull\/[1-9][0-9]*\/merge/, 'Dependency acquisition source/run binding is invalid')
['run_id': 'GITHUB_RUN_ID', 'run_attempt': 'GITHUB_RUN_ATTEMPT'].each { key, variable ->
    def value = System.getenv(variable)
    requireMigration(value != null && value ==~ /[1-9][0-9]{0,19}/, 'Dependency acquisition run identity is invalid')
    binding[key] = new BigInteger(value)
}

def androidRoot = gradle.startParameter.currentDir.toPath().toAbsolutePath().normalize()
def safeParents = { path ->
    def cursor = path.toAbsolutePath().normalize()
    while (cursor != null) {
        requireMigration(!Files.isSymbolicLink(cursor), 'Dependency acquisition found a linked path')
        cursor = cursor.parent
    }
}
safeParents(androidRoot)
def instrumentation = androidRoot.resolve('app/src/androidTest')
safeParents(instrumentation)
def hasInstrumentation = Files.isDirectory(instrumentation, LinkOption.NOFOLLOW_LINKS)
def writerTasks = [':app:prepareRobolectricSdk', ':app:prepareBundledSqliteHost']
['Debug', 'Release', 'Diagnostic'].each { variant ->
    ['Kotlin', 'JavaWithJavac', 'UnitTestKotlin', 'UnitTestJavaWithJavac'].each { suffix ->
        writerTasks.add(":app:compileWatchAndroid${variant}${suffix}".toString())
    }
    writerTasks.add(":app:lintWatchAndroid${variant}".toString())
}
if (hasInstrumentation) {
    ['Kotlin', 'JavaWithJavac'].each { suffix ->
        writerTasks.add(":app:compileWatchAndroidDiagnosticAndroidTest${suffix}".toString())
    }
}
requireMigration(gradle.startParameter.taskNames == writerTasks + [':ciAcquireDependencyFiles', ':ciResolveAndLockAll'],
    'Dependency acquisition task selection differs from the reviewed writer')
def inputConsumers = new ArrayList(writerTasks)
['Debug', 'Release', 'Diagnostic'].each { variant ->
    ["lintAnalyzeWatchAndroid${variant}", "lintAnalyzeWatchAndroid${variant}UnitTest", "lintReportWatchAndroid${variant}"].each { name ->
        inputConsumers.add(":app:${name}".toString())
    }
}
def optionalInputs = ['Debug', 'Release', 'Diagnostic'].collect { ":app:lintAnalyzeWatchAndroid${it}AndroidTest".toString() }
def archiveConsumers = [:]
(inputConsumers + optionalInputs).each { id -> archiveConsumers[id] = 'task-input-archives' }
['Debug', 'Release', 'Diagnostic'].each { variant ->
    archiveConsumers[":app:testWatchAndroid${variant}UnitTest".toString()] = 'test-classpath-archives'
}
['bundledSqliteHost', 'robolectricSdk', 'robolectricSdk30'].each { name ->
    archiveConsumers[":app:${name}".toString()] = 'configuration-artifacts'
}
[':buildscript:classpath', ':app:buildscript:classpath'].each { id -> archiveConsumers[id] = 'buildscript-artifacts' }
def archiveRejection = { id, kind, file, path, regularFile, safeName ->
    // This observes the first refusal without reading it or exporting a path/name; it never permits the input.
    def approved = archiveConsumers.containsKey(id) && archiveConsumers[id] == kind
    def scope = path.startsWith(androidRoot.resolve('build')) || path.startsWith(androidRoot.resolve('app/build')) ?
        'project-build-output' : path.startsWith(androidRoot) ? 'project-input' :
        path.startsWith(gradle.gradleUserHomeDir.toPath().toAbsolutePath().normalize()) ? 'gradle-user-home' : 'outside-project'
    def directory = Files.isDirectory(path, LinkOption.NOFOLLOW_LINKS)
    def state = directory ? 'directory' : regularFile ? 'regular-file' :
        Files.exists(path, LinkOption.NOFOLLOW_LINKS) ? 'other' : 'not-observed'
    def name = file.name
    def nameHash = name.length() <= 1024 ?
        MessageDigest.getInstance('SHA-256').digest(name.getBytes('UTF-8')).encodeHex().toString() : null
    def line = 'CI_DEPENDENCY_ARCHIVE_REJECTION ' + groovy.json.JsonOutput.toJson([
        schema_version: 1, kind: 'dependency-archive-rejection',
        consumer_id: approved ? id : 'unapproved-consumer', consumer_kind: approved ? kind : 'unapproved-kind',
        input_scope: scope, regular_file_at_gate: regularFile, archive_name_safe_at_gate: safeName,
        directory: directory, observed_state: state,
        archive_suffix: name.endsWith('.jar') ? 'jar' : name.endsWith('.aar') ? 'aar' : 'other',
        basename_sha256: nameHash,
    ])
    requireMigration(line.getBytes('UTF-8').length <= 1024, 'Dependency acquisition archive rejection diagnostic exceeds its bound')
    gradle.rootProject.logger.lifecycle(line)
}
def hashedFiles = [:]
long reservedBytes = 0
def archiveBytes = { file, id, kind ->
    def path = file.toPath().toAbsolutePath().normalize()
    safeParents(path)
    def regularFile = Files.isRegularFile(path, LinkOption.NOFOLLOW_LINKS)
    def safeName = file.name ==~ /[A-Za-z0-9_.+\-]{1,200}\.(jar|aar)/
    try {
        requireMigration(regularFile && safeName, 'Dependency acquisition archive is missing or unsafe')
    } catch (GradleException failure) {
        try {
            archiveRejection(id, kind, file, path, regularFile, safeName)
        } catch (Throwable ignored) {
            try {
                failure.addSuppressed(new GradleException('Dependency acquisition archive rejection diagnostic is unavailable'))
            } catch (Throwable ignoredSuppression) {
                // Diagnostic allocation/linkage failures cannot replace the original archive refusal.
            }
        }
        throw failure
    }
    def before = Files.readAttributes(path, java.nio.file.attribute.BasicFileAttributes, LinkOption.NOFOLLOW_LINKS)
    requireMigration(before.size() > 0 && before.size() <= 256L * 1024 * 1024, 'Dependency acquisition archive exceeds its bound')
    def cached = hashedFiles[path]
    if (cached != null) {
        requireMigration(cached.identity == [before.fileKey(), before.size(), before.lastModifiedTime()],
            'Dependency acquisition archive changed after hashing')
        return new LinkedHashMap(cached.record)
    }
    requireMigration(hashedFiles.size() < 4096 && reservedBytes + before.size() <= 2L * 1024 * 1024 * 1024,
        'Dependency acquisition total archive bound exceeded')
    reservedBytes += before.size()
    def digest = MessageDigest.getInstance('SHA-256')
    long readBytes = 0
    Files.newInputStream(path, LinkOption.NOFOLLOW_LINKS).withCloseable { stream ->
        byte[] buffer = new byte[65536]
        int count
        while ((count = stream.read(buffer)) != -1) {
            readBytes += count
            requireMigration(readBytes <= before.size(), 'Dependency acquisition archive grew while hashing')
            digest.update(buffer, 0, count)
        }
    }
    safeParents(path)
    def after = Files.readAttributes(path, java.nio.file.attribute.BasicFileAttributes, LinkOption.NOFOLLOW_LINKS)
    def identity = [before.fileKey(), before.size(), before.lastModifiedTime()]
    requireMigration(readBytes == before.size() && identity == [after.fileKey(), after.size(), after.lastModifiedTime()],
        'Dependency acquisition archive changed while hashing')
    def record = [name: file.name, size: readBytes, sha256: digest.digest().encodeHex().toString()]
    hashedFiles[path] = [identity: identity, record: record]
    record
}
def fileCollectionRecord = { id, kind, collection ->
    // .files is the real FileCollection API: missing archives fail, directories are counted without traversing sources.
    def files = collection.files
    requireMigration(files.size() <= 4096, 'Dependency acquisition consumer file bound exceeded')
    def record = [id: id, kind: kind, file_count: files.size(), directory_count: 0,
        excluded_file_count: 0, missing_non_archive_count: 0, files: []]
    files.each { file ->
        def path = file.toPath().toAbsolutePath().normalize()
        safeParents(path)
        if (file.name.endsWith('.jar') || file.name.endsWith('.aar')) {
            record.files.add(archiveBytes(file, id, kind))
        } else if (Files.isDirectory(path, LinkOption.NOFOLLOW_LINKS)) {
            record.directory_count++
        } else if (Files.isRegularFile(path, LinkOption.NOFOLLOW_LINKS)) {
            record.excluded_file_count++
        } else if (!Files.exists(path, LinkOption.NOFOLLOW_LINKS)) {
            record.missing_non_archive_count++
        } else {
            throw new GradleException('Dependency acquisition consumer has an unsupported input file type')
        }
    }
    record.files.sort { a, b -> groovy.json.JsonOutput.toJson(a) <=> groovy.json.JsonOutput.toJson(b) }
    record
}
def moduleArtifactsRecord = { id, kind, configuration ->
    requireMigration(configuration != null && configuration.canBeResolved, 'Dependency acquisition configuration is unavailable')
    // Accessing incoming.artifacts.artifacts downloads actual module files, unlike resolutionResult.
    def artifacts = configuration.incoming.artifacts.artifacts
    requireMigration(artifacts.size() <= 4096, 'Dependency acquisition module artifact bound exceeded')
    def files = artifacts.collect { artifact ->
        def component = artifact.id.componentIdentifier
        requireMigration(component instanceof ModuleComponentIdentifier, 'Dependency acquisition requires Maven module artifacts')
        def parts = [component.group, component.module, component.version]
        requireMigration(parts.every { it ==~ /[A-Za-z0-9_.+\-]{1,120}/ }, 'Dependency acquisition module coordinate is unsafe')
        archiveBytes(artifact.file, id, kind) + [component: parts]
    }.sort { a, b -> groovy.json.JsonOutput.toJson(a) <=> groovy.json.JsonOutput.toJson(b) }
    [id: id, kind: kind, files: files]
}
def consumers = []
def acquisitionDone = false
gradle.taskGraph.whenReady { graph ->
    // Classpath getters may resolve files, but no Test task may enter the writer graph or run any test action.
    requireMigration(!graph.allTasks.any { it instanceof Test }, 'Dependency acquisition cannot execute business JUnit')
    requireMigration(inputConsumers.every { graph.hasTask(it) }, 'Dependency acquisition is missing a real compile or lint consumer')
}
gradle.projectsEvaluated {
    def root = gradle.rootProject
    requireMigration(root.allprojects.collect { it.path }.sort() == [':', ':app'], 'Dependency acquisition project scope differs')
    def acquire = root.tasks.register('ciAcquireDependencyFiles') { task ->
        task.notCompatibleWithConfigurationCache('Dependency acquisition reads exact consumer files')
        task.mustRunAfter(inputConsumers)
        // Runtime classpath outputs need their own producers before file acquisition.
        ['Debug', 'Release', 'Diagnostic'].each { variant ->
            def id = ":app:testWatchAndroid${variant}UnitTest".toString()
            def test = root.tasks.getByPath(id)
            requireMigration(test instanceof Test, 'Dependency acquisition test classpath is unavailable')
            task.dependsOn(test.classpath.buildDependencies)
        }
        task.doLast {
            (inputConsumers + optionalInputs.findAll { gradle.taskGraph.hasTask(it) }).each { id ->
                def consumer = root.tasks.getByPath(id)
                requireMigration(consumer.state.executed && consumer.state.failure == null, 'Dependency acquisition consumer did not complete')
                def outcome = consumer.state.noSource ? 'no-source' : consumer.state.upToDate ? 'up-to-date' : 'executed'
                requireMigration(!consumer.state.skipped || outcome != 'executed', 'Dependency acquisition consumer was skipped')
                def record = fileCollectionRecord(id, 'task-input-archives', consumer.inputs.files)
                record.outcome = outcome
                consumers.add(record)
            }
            ['Debug', 'Release', 'Diagnostic'].each { variant ->
                def id = ":app:testWatchAndroid${variant}UnitTest".toString()
                def test = root.tasks.getByPath(id)
                requireMigration(test instanceof Test && !gradle.taskGraph.hasTask(id), 'Dependency acquisition test classpath is unavailable')
                consumers.add(fileCollectionRecord(id, 'test-classpath-archives', test.classpath))
            }
            def app = root.project(':app')
            ['bundledSqliteHost', 'robolectricSdk', 'robolectricSdk30'].each { name ->
                consumers.add(moduleArtifactsRecord(":app:${name}".toString(), 'configuration-artifacts', app.configurations.findByName(name)))
            }
            [root, app].each { project ->
                def id = project.path == ':' ? ':buildscript:classpath' : ':app:buildscript:classpath'
                consumers.add(moduleArtifactsRecord(id, 'buildscript-artifacts', project.buildscript.configurations.findByName('classpath')))
            }
            requireMigration(consumers.size() <= 64, 'Dependency acquisition consumer bound exceeded')
            acquisitionDone = true
        }
    }
    root.tasks.named('ciResolveAndLockAll').configure { task ->
        // The existing graph collector runs after every real file consumer, including the runtime classpath getters.
        task.mustRunAfter(inputConsumers)
        task.mustRunAfter(acquire)
        task.doLast {
            requireMigration(acquisitionDone, 'Dependency acquisition file stage did not complete before lock capture')
            def projects = [:]
            root.allprojects.sort { it.path }.each { project ->
                def configurations = project.configurations.findAll { it.canBeResolved }.sort { it.name }
                requireMigration(configurations.size() <= 4096, 'Dependency acquisition configuration bound exceeded')
                configurations.each { configuration ->
                    requireMigration(configuration.name ==~ /[A-Za-z0-9_.\-]{1,200}/, 'Dependency acquisition configuration name is unsafe')
                    // This only verifies the complete lock graph; archive hashes above always come from file streams.
                    def result = configuration.incoming.resolutionResult
                    requireMigration(result.allComponents.size() <= 20000 && result.allDependencies.size() <= 60000 &&
                        !result.allDependencies.any { it instanceof UnresolvedDependencyResult }, 'Dependency acquisition lock graph is incomplete')
                }
                projects[project.path] = configurations.collect { it.name }
            }
            def record = [schema_version: 1, kind: 'dependency-file-acquisition', phase: 'migration-acquire'] + binding + [
                writer_tasks: writerTasks, test_task_count: 0, consumers: consumers.sort { it.id },
                lock_capture: [kind: 'all-resolvable-configuration-graphs', task: ':ciResolveAndLockAll', status: 'completed',
                    configuration_count: projects.values().sum { it.size() }, unresolved_dependency_count: 0,
                    project_configurations: projects],
            ]
            def bytes = (groovy.json.JsonOutput.toJson(record) + '\n').getBytes('UTF-8')
            requireMigration(bytes.length <= 4 * 1024 * 1024, 'Dependency acquisition report bound exceeded')
            def destination = androidRoot.resolve('app/build/reports/dependency-bootstrap/dependency-acquisition.json')
            safeParents(destination)
            requireMigration(Files.isDirectory(destination.parent, LinkOption.NOFOLLOW_LINKS) &&
                !Files.exists(destination, LinkOption.NOFOLLOW_LINKS), 'Dependency acquisition report destination is unsafe')
            Files.write(destination, bytes, StandardOpenOption.CREATE_NEW, StandardOpenOption.WRITE, LinkOption.NOFOLLOW_LINKS)
            safeParents(destination)
            root.logger.lifecycle('CI_DEPENDENCY_ACQUISITION ' + groovy.json.JsonOutput.toJson([
                phase: 'migration-acquire', consumer_count: consumers.size(), unique_archive_count: hashedFiles.size(),
                unique_archive_bytes: reservedBytes, report_sha256: MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString(),
            ]))
        }
    }
}
