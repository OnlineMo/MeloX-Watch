    requireMigration(!graph.allTasks.any { it instanceof Test }, 'Variant dependency acquisition cannot execute business JUnit')
    requireMigration(graph.allTasks.size() <= 4096 && inputConsumers.every { graph.hasTask(it) } && graph.hasTask(acquireId) &&
        graph.hasTask(collectorId) == (mode == 'diagnostic'), 'Variant dependency acquisition real task graph is incomplete')
    requireMigration(graph.allTasks.every { task ->
        !['Debug', 'Release', 'Diagnostic'].findAll { it != variant }.any { task.path.contains('WatchAndroid' + it) }
    }, 'Variant dependency acquisition graph contains another variant')
    def actualProducers = selectedTest.classpath.buildDependencies.getDependencies(selectedTest).toList().sort { it.path }
    requireMigration(actualProducers.collect { it.path } == classpathProducers.collect { it.path } &&
        classpathProducers.every { !(it instanceof Test) && graph.hasTask(it.path) },
        'Variant dependency acquisition classpath producer graph changed')
}
gradle.projectsEvaluated {
    def root = gradle.rootProject
    requireMigration(root.allprojects.collect { it.path }.sort() == [':', ':app'], 'Variant dependency acquisition project scope differs')
    selectedTest = root.tasks.getByPath(testId)
    requireMigration(selectedTest instanceof Test, 'Variant dependency acquisition Test.classpath is unavailable')
    classpathProducers = selectedTest.classpath.buildDependencies.getDependencies(selectedTest).toList().sort { it.path }
    requireMigration(!classpathProducers.isEmpty() && classpathProducers.size() <= 4096 &&
        classpathProducers.every { !(it instanceof Test) }, 'Variant dependency acquisition has no Test-free classpath producers')
    def acquire = root.tasks.register('ciAcquireVariantDependencyFiles') { task ->
        task.notCompatibleWithConfigurationCache('Variant acquisition reads exact consumer files and predecessor originals')
        task.mustRunAfter(inputConsumers)
        // This selects the real FileCollection producers for this variant, including its runtime classes archives.
        task.dependsOn(selectedTest.classpath.buildDependencies)
        task.doLast {
            requireMigration(!gradle.taskGraph.hasTask(testId), 'Variant dependency acquisition Test task entered the graph')
            def actualProducers = selectedTest.classpath.buildDependencies.getDependencies(selectedTest).toList().sort { it.path }
            requireMigration(actualProducers.collect { it.path } == classpathProducers.collect { it.path },
                'Variant dependency acquisition classpath producers changed before file capture')
            def producerRecords = classpathProducers.collect { [id: it.path, outcome: completedOutcome(it)] }
            (inputConsumers + optionalInputs.findAll { gradle.taskGraph.hasTask(it) }).each { id ->
                def consumer = root.tasks.getByPath(id)
                def outcome = completedOutcome(consumer)
                def record = fileCollectionRecord(id, 'task-input-archives', consumer.inputs.files)
                record.outcome = outcome
                consumers.add(record)
            }
            consumers.add(fileCollectionRecord(testId, 'test-classpath-archives', selectedTest.classpath))
            def app = root.project(':app')
            ['bundledSqliteHost', 'robolectricSdk', 'robolectricSdk30'].each { name ->
                consumers.add(moduleArtifactsRecord(":app:${name}".toString(), 'configuration-artifacts', app.configurations.findByName(name)))
            }
            [root, app].each { project ->
                def id = project.path == ':' ? ':buildscript:classpath' : ':app:buildscript:classpath'
                consumers.add(moduleArtifactsRecord(id, 'buildscript-artifacts', project.buildscript.configurations.findByName('classpath')))
            }
            requireMigration(priorConsumerCount + consumers.size() <= 64, 'Variant dependency acquisition shared consumer bound exceeded')
            def record = [schema_version: 2, kind: 'dependency-variant-file-acquisition', phase: phase, variant: mode] + binding + [
                request_sha256: requestDigest, predecessor_acquisitions: predecessorPins, writer_tasks: writerTasks,
                test_task_count: 0, graph_task_count: gradle.taskGraph.allTasks.size(),
                runtime_classpath: [consumer_id: testId, producer_tasks: producerRecords], consumers: consumers.sort { it.id },
                archive_budget: [unique_archive_count: hashedFiles.size(), unique_archive_bytes: reservedBytes,
                    cumulative_archive_count: priorArchiveCount + hashedFiles.size(),
                    cumulative_archive_bytes: priorArchiveBytes + reservedBytes,
                    cumulative_consumer_count: priorConsumerCount + consumers.size()],
                file_capture: [task: acquireId, phase: phase, status: 'completed'],
            ]
            validateRecord(record, phase, predecessorPins, previousRecords)
            mergeConsumers(previousRecords + [(phase): record])
            currentPin = writeOriginal('acquisitions/' + phase + '.json', record)
            acquisitionDone = true
            root.logger.lifecycle('CI_DEPENDENCY_VARIANT_ACQUISITION ' + encoded([
                phase: phase, producer_count: producerRecords.size(), consumer_count: consumers.size(),
                unique_archive_count: hashedFiles.size(), unique_archive_bytes: reservedBytes, report_sha256: currentPin.sha256,
            ]))
        }
    }
    if (mode == 'diagnostic') {
        root.tasks.named('ciResolveAndLockAll').configure { task ->
            task.mustRunAfter(inputConsumers)
            task.mustRunAfter(acquire)
            task.doFirst {
                requireMigration(acquisitionDone, 'Variant acquisition file stage did not complete before full lock capture')
            }
            task.doLast {
                requireMigration(acquisitionDone && currentPin != null, 'Variant acquisition has no current file original')
                def records = new LinkedHashMap(previousRecords)
                def pins = previousPhases.collectEntries { capturePhase ->
                    def relative = 'acquisitions/' + capturePhase + '.json'
                    byte[] original = rawBytes(reportRoot.resolve(relative))
                    requireMigration(digestBytes(original) == predecessorPins[capturePhase], 'Variant acquisition predecessor drifted during full lock capture')
                    [(capturePhase): [file: relative, sha256: predecessorPins[capturePhase]]]
                }
                byte[] currentOriginal = rawBytes(reportRoot.resolve(currentPin.file))
                requireMigration(digestBytes(currentOriginal) == currentPin.sha256, 'Variant acquisition current original drifted before merge')
                def currentRecord = new groovy.json.JsonSlurper().parse(currentOriginal)
                validateRecord(currentRecord, phase, predecessorPins, previousRecords)
                records[phase] = currentRecord
                pins[phase] = currentPin
                requireMigration(records.keySet() == phases.toSet(), 'Variant acquisition full merge is missing a phase')
                def mergedConsumers = mergeConsumers(records)
                def projects = [:]
                root.allprojects.sort { it.path }.each { project ->
                    def configurations = project.configurations.findAll { it.canBeResolved }.sort { it.name }
                    requireMigration(configurations.size() <= 4096, 'Variant acquisition full configuration bound exceeded')
                    configurations.each { configuration ->
                        requireMigration(configuration.name ==~ /[A-Za-z0-9_.\-]{1,200}/, 'Variant acquisition configuration name is unsafe')
                        // Only the already-run full graph collector supplies lock coverage, never archive hash evidence.
                        def result = configuration.incoming.resolutionResult
                        requireMigration(result.allComponents.size() <= 20000 && result.allDependencies.size() <= 60000 &&
                            !result.allDependencies.any { it instanceof UnresolvedDependencyResult }, 'Variant acquisition full lock graph is incomplete')
                    }
                    projects[project.path] = configurations.collect { it.name }
                }
                hashedFiles.each { path, cached ->
                    safeParents(path)
                    def attributes = Files.readAttributes(path, java.nio.file.attribute.BasicFileAttributes, LinkOption.NOFOLLOW_LINKS)
                    requireMigration(cached.identity == [attributes.fileKey(), attributes.size(), attributes.lastModifiedTime()],
                        'Variant acquisition archive drifted during full lock capture')
                }
                def mergedRecord = [schema_version: 2, kind: 'dependency-variant-acquisition-merge', phase: phase] + binding + [
                    request_sha256: requestDigest, variant_acquisitions: pins, consumers: mergedConsumers, archive_budget: archiveBudget(records),
                    lock_capture: [kind: 'all-resolvable-configuration-graphs', task: collectorId, phase: phase,
                        preceding_file_capture_task: acquireId, status: 'completed',
                        configuration_count: projects.values().sum { it.size() }, unresolved_dependency_count: 0,
                        project_configurations: projects],
                ]
                def mergedPin = writeOriginal('dependency-variant-acquisition.json', mergedRecord)
                root.logger.lifecycle('CI_DEPENDENCY_VARIANT_MERGE ' + encoded([
                    phase: phase, collector_task: collectorId, acquisition_count: records.size(), consumer_count: mergedConsumers.size(),
                    cumulative_archive_count: mergedRecord.archive_budget.cumulative_archive_count,
                    cumulative_archive_bytes: mergedRecord.archive_budget.cumulative_archive_bytes, report_sha256: mergedPin.sha256,
                ]))
            }
        }
    }
}
